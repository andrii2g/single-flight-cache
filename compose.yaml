services:
  test:
    image: mcr.microsoft.com/dotnet/sdk:10.0-noble
    working_dir: /workspace
    volumes:
      - .:/workspace
      - nuget-cache:/root/.nuget/packages
      - test-build:/build
    command:
      - dotnet
      - test
      - --solution
      - SingleFlightCacheStampedeLab.slnx
      - -c
      - Release
      - --artifacts-path
      - /build
      - --timeout
      - 60s

  lab:
    build:
      context: .
      target: runtime
    volumes:
      - ./artifacts:/app/artifacts
    command:
      - quick
      - --output
      - /app/artifacts

volumes:
  nuget-cache:
  test-build:
